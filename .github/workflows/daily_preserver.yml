name: Daily Delta Options Preserver

on:
  schedule:
    # Daily at 12:30 UTC = 6:00 PM IST
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Expiry Date to Preserve (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  preserve-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyarrow

      - name: Run Delta Preserver & Upload to Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE=$(date -u -d '+5 hours 30 minutes' +%Y-%m-%d)
          fi
          echo "Preserving Delta Options for Expiry: $TARGET_DATE"
          python main.py "$TARGET_DATE"